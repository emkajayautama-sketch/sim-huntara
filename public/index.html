<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIM-HUNTARA BNPB — Aplikasi Pemantauan Progres & Pencairan Multi-Vendor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar no-print">
    <div class="sidebar-brand">
      <img src="/assets/logo-bnpb.png" alt="Logo BNPB" />
      <div class="sidebar-brand-text">
        <h1>SIM-HUNTARA</h1>
        <p>Monitoring & Pencairan BNPB</p>
      </div>
    </div>

    <div class="sidebar-vendor-box">
      <label for="globalVendorSelect">Perusahaan / Vendor Aktif:</label>
      <select id="globalVendorSelect" class="sidebar-vendor-select"></select>
    </div>

    <nav class="nav-menu" id="sidebarNav">
      <button class="nav-item active" data-tab="dashboard">
        <span class="nav-icon">📊</span>
        <span>Dashboard & Progres Desa</span>
      </button>
      <button class="nav-item" data-tab="vendors">
        <span class="nav-icon">🏢</span>
        <span>Data Perusahaan (Vendor)</span>
        <span class="nav-badge" id="badgeVendorCount">2</span>
      </button>
      <button class="nav-item" data-tab="units">
        <span class="nav-icon">🏠</span>
        <span>Data BNBA & Progres Fisik</span>
        <span class="nav-badge" id="badgeUnitCount">59</span>
      </button>
      <button class="nav-item" data-tab="batches">
        <span class="nav-icon">💰</span>
        <span>Pencairan Gelondongan</span>
        <span class="nav-badge ready" id="badgeReadyCount">0</span>
      </button>
      <button class="nav-item" data-tab="print">
        <span class="nav-icon">🖨️</span>
        <span>Pusat Cetak Berkas & Foto</span>
      </button>
      <button class="nav-item" data-tab="tools">
        <span class="nav-icon">📷</span>
        <span>Studio Watermark & Blanko</span>
      </button>
      <button class="nav-item" data-tab="sharing">
        <span class="nav-icon">🔗</span>
        <span>Sharing Tim & Backup Data</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="lan-chip" id="lanInfoBox">
        <strong>Mode Jaringan Aktif</strong><br />
        Memuat info IP...
      </div>
      <div id="saveStatusText">✅ Tersimpan Otomatis</div>
    </div>
  </aside>

  <!-- MAIN CONTENT WRAPPER -->
  <div class="main-wrapper">
    <header class="topbar no-print">
      <div class="topbar-title">
        <h2 id="pageTitle">Dashboard Pemantauan Progres & Pencairan Huntara</h2>
        <p id="pageSubtitle">Pantau progres 0%, 50%, 100% per Desa/Kecamatan dan kelola pencairan gelondongan (Min. 10 Unit)</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="window.app.quickDemo100()">
          ⚡ Simulasi Selesai 100% (Pilih Desa/Unit)
        </button>
        <button class="btn btn-primary btn-sm" onclick="window.app.switchTab('batches')">
          ➕ Buat Pencairan Gelondongan
        </button>
      </div>
    </header>

    <main class="content-area" id="mainContent">
      <!-- Динамический контент рендерится через app.js -->
    </main>
  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalRoot" class="no-print"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="/app.js"></script>
</body>
</html>
